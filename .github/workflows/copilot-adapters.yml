name: Copilot adapters

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  copilot-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Copilot adapters
        run: python3 scripts/sync_copilot_adapters.py --check
