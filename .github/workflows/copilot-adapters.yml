name: Copilot adapters

on:
  pull_request:
    paths:
      - AGENTS.md
      - .opencode/agents/agent-team-designer.md
      - .opencode/skills/agent-audit/**
      - .opencode/skills/agent-org-design/**
      - .opencode/skills/model-selection/**
      - .opencode/skills/prompt-patterns/**
      - .opencode/skills/skill-security-audit/**
      - .github/agents/**
      - .github/skills/**
      - .github/copilot-instructions.md
      - scripts/sync_copilot_adapters.py
      - .github/workflows/copilot-adapters.yml
  push:
    branches:
      - main
    paths:
      - AGENTS.md
      - .opencode/agents/agent-team-designer.md
      - .opencode/skills/agent-audit/**
      - .opencode/skills/agent-org-design/**
      - .opencode/skills/model-selection/**
      - .opencode/skills/prompt-patterns/**
      - .opencode/skills/skill-security-audit/**
      - .github/agents/**
      - .github/skills/**
      - .github/copilot-instructions.md
      - scripts/sync_copilot_adapters.py
      - .github/workflows/copilot-adapters.yml

permissions:
  contents: read

jobs:
  copilot-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Copilot adapters
        run: python3 scripts/sync_copilot_adapters.py --check
