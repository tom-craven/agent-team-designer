name: Runtime sync

on:
  pull_request:
    paths:
      - AGENTS.md
      - docs/agent-team-designer-behavior.md
      - opencode.json
      - .opencode/agents/**
      - .opencode/skills/**
      - .github/agents/**
      - .github/skills/**
      - .github/copilot-instructions.md
      - .github/pull_request_template.md
      - scripts/sync_runtime_docs.py
      - .github/workflows/runtime-sync.yml
  push:
    branches:
      - main
    paths:
      - AGENTS.md
      - docs/agent-team-designer-behavior.md
      - opencode.json
      - .opencode/agents/**
      - .opencode/skills/**
      - .github/agents/**
      - .github/skills/**
      - .github/copilot-instructions.md
      - .github/pull_request_template.md
      - scripts/sync_runtime_docs.py
      - .github/workflows/runtime-sync.yml

permissions:
  contents: read

jobs:
  runtime-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated adapters and runtime invariants
        run: python3 scripts/sync_runtime_docs.py --check
